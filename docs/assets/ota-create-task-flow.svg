<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="950" viewBox="0 0 1320 950" role="img" aria-labelledby="title desc">
  <title id="title">新增 OTA 任务三步创建 UML 时序图</title>
  <desc id="desc">以 UML 时序图形式展示新增 OTA 任务从基本任务、策略配置到预览发布的交互流程，包含保存草稿、校验失败、提交审批和手动导入直接发布分支。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#536176" /></marker>
    <marker id="reply" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8a96a8" /></marker>
    <style>
      .bg{fill:#f7fafc}.title{fill:#172033;font:700 27px "Microsoft YaHei","PingFang SC",Arial,sans-serif}.sub{fill:#536176;font:500 14px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .stage{fill:#eef5ff;stroke:#c9dcff;stroke-width:1.2}.stageText{fill:#2f6fed;font:700 13px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .actor{fill:#fff;stroke:#cbd7e6;stroke-width:1.4}.actorText{fill:#172033;font:700 14px "Microsoft YaHei","PingFang SC",Arial,sans-serif}.actorSub{fill:#66758a;font:500 11px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .lane{stroke:#ccd6e3;stroke-width:1.4;stroke-dasharray:6 7}.msg{stroke:#536176;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.return{stroke:#8a96a8;stroke-width:1.6;fill:none;stroke-dasharray:5 5;marker-end:url(#reply)}.self{stroke:#536176;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .label{fill:#172033;font:600 12px "Microsoft YaHei","PingFang SC",Arial,sans-serif}.small{fill:#536176;font:500 11px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .frame{fill:none;stroke:#b7c4d6;stroke-width:1.3}.frameHead{fill:#eef2f7;stroke:#b7c4d6;stroke-width:1.3}.frameText{fill:#334155;font:700 12px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .ok{fill:#e9f8f1;stroke:#b9e6cf;stroke-width:1.1}.warn{fill:#fff4e5;stroke:#ffd29a;stroke-width:1.1}.muted{fill:#f3f6fa;stroke:#d9e2ee;stroke-width:1.1}.statusText{fill:#172033;font:700 12px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .note{fill:#fff8ec;stroke:#ffd8a8;stroke-width:1.2}.noteText{fill:#8a4b12;font:700 12px "Microsoft YaHei","PingFang SC",Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1320" height="950" rx="22" />
  <text class="title" x="46" y="54">新增任务三步创建与发布 UML 时序图</text>
  <text class="sub" x="46" y="82">用户按基本任务、策略配置、预览发布完成创建；指定版本/文件导入进入审批，手动导入直接发布。</text>
  <rect class="stage" x="64" y="112" width="178" height="34" rx="17" /><text class="stageText" x="153" y="134" text-anchor="middle">步骤 1：基本任务</text>
  <rect class="stage" x="452" y="112" width="178" height="34" rx="17" /><text class="stageText" x="541" y="134" text-anchor="middle">步骤 2：策略配置</text>
  <rect class="stage" x="884" y="112" width="178" height="34" rx="17" /><text class="stageText" x="973" y="134" text-anchor="middle">步骤 3：预览发布</text>
  <rect class="note" x="1088" y="110" width="184" height="38" rx="8" /><text class="noteText" x="1180" y="134" text-anchor="middle">文件/手动不选择大区</text>
  <rect class="actor" x="50" y="168" width="150" height="52" rx="8" /><text class="actorText" x="125" y="190" text-anchor="middle">运维/测试人员</text><text class="actorSub" x="125" y="209" text-anchor="middle">任务创建者</text>
  <rect class="actor" x="308" y="168" width="150" height="52" rx="8" /><text class="actorText" x="383" y="190" text-anchor="middle">OTA 前端</text><text class="actorSub" x="383" y="209" text-anchor="middle">三步表单</text>
  <rect class="actor" x="566" y="168" width="150" height="52" rx="8" /><text class="actorText" x="641" y="190" text-anchor="middle">OTA 后端</text><text class="actorSub" x="641" y="209" text-anchor="middle">校验/保存/发布</text>
  <rect class="actor" x="824" y="168" width="150" height="52" rx="8" /><text class="actorText" x="899" y="190" text-anchor="middle">审批系统</text><text class="actorSub" x="899" y="209" text-anchor="middle">指定版本/文件</text>
  <rect class="actor" x="1082" y="168" width="150" height="52" rx="8" /><text class="actorText" x="1157" y="190" text-anchor="middle">任务列表/详情</text><text class="actorSub" x="1157" y="209" text-anchor="middle">状态展示</text>
  <path class="lane" d="M125 220 V922" /><path class="lane" d="M383 220 V922" /><path class="lane" d="M641 220 V922" /><path class="lane" d="M899 220 V922" /><path class="lane" d="M1157 220 V922" />
  <path class="msg" d="M125 252 H383" /><text class="label" x="254" y="244" text-anchor="middle">单击新增任务</text>
  <path class="self" d="M383 276 h48 v28 h-48" /><text class="label" x="478" y="295">初始化三步表单</text>
  <path class="msg" d="M125 330 H383" /><text class="label" x="254" y="322" text-anchor="middle">填写基本任务信息</text><text class="small" x="254" y="344" text-anchor="middle">名称、版本、升级包、时间、说明</text>
  <path class="msg" d="M383 370 H641" /><text class="label" x="512" y="362" text-anchor="middle">提交基本字段校验</text>
  <path class="return" d="M641 400 H383" /><text class="small" x="512" y="392" text-anchor="middle">校验通过，进入策略配置</text>
  <rect class="frame" x="72" y="422" width="1118" height="74" rx="4" /><rect class="frameHead" x="72" y="422" width="112" height="26" rx="4" /><text class="frameText" x="128" y="440" text-anchor="middle">alt 校验失败</text>
  <path class="return" d="M383 468 H125" /><text class="label" x="254" y="460" text-anchor="middle">展示字段错误，停留基本任务</text>
  <rect class="frame" x="72" y="520" width="1118" height="96" rx="4" /><rect class="frameHead" x="72" y="520" width="124" height="26" rx="4" /><text class="frameText" x="134" y="538" text-anchor="middle">opt 保存草稿</text>
  <path class="msg" d="M125 562 H383" /><text class="label" x="254" y="554" text-anchor="middle">单击保存草稿</text>
  <path class="msg" d="M383 590 H641" /><text class="label" x="512" y="582" text-anchor="middle">保存当前步骤和配置</text>
  <rect class="muted" x="1074" y="572" width="166" height="34" rx="8" /><text class="statusText" x="1157" y="594" text-anchor="middle">状态：待发布</text>
  <path class="msg" d="M125 654 H383" /><text class="label" x="254" y="646" text-anchor="middle">选择升级方式并填写策略</text>
  <path class="self" d="M383 678 h48 v28 h-48" /><text class="small" x="478" y="697">指定版本：分发范围/源版本/数量</text>
  <path class="self" d="M383 716 h48 v28 h-48" /><text class="small" x="478" y="735">文件/手动：设备清单或设备 ID</text>
  <path class="msg" d="M383 772 H641" /><text class="label" x="512" y="764" text-anchor="middle">提交策略校验和预检</text>
  <path class="return" d="M641 802 H383" /><text class="small" x="512" y="794" text-anchor="middle">返回摘要、可升级数、异常明细</text>
  <rect class="frame" x="72" y="820" width="500" height="64" rx="4" /><rect class="frameHead" x="72" y="820" width="112" height="26" rx="4" /><text class="frameText" x="128" y="838" text-anchor="middle">alt 校验失败</text>
  <path class="return" d="M383 862 H125" /><text class="label" x="254" y="854" text-anchor="middle">提示错误，停留策略配置</text>
  <path class="msg" d="M125 896 H383" /><text class="label" x="254" y="888" text-anchor="middle">确认预览发布</text>
  <path class="msg" d="M383 896 H641" /><text class="label" x="512" y="888" text-anchor="middle">提交发布请求</text>
  <rect class="frame" x="596" y="820" width="626" height="104" rx="4" /><rect class="frameHead" x="596" y="820" width="126" height="26" rx="4" /><text class="frameText" x="659" y="838" text-anchor="middle">alt 发布分支</text>
  <path class="msg" d="M641 856 H899" /><text class="label" x="770" y="848" text-anchor="middle">指定版本/文件：创建审批单</text>
  <path class="msg" d="M641 892 H1157" /><text class="label" x="899" y="884" text-anchor="middle">手动导入：直接发布</text>
  <rect class="warn" x="1078" y="838" width="158" height="30" rx="8" /><text class="statusText" x="1157" y="858" text-anchor="middle">状态：待审批</text>
  <rect class="ok" x="1062" y="886" width="190" height="30" rx="8" /><text class="statusText" x="1157" y="906" text-anchor="middle">状态：待执行/升级中</text>
</svg>
